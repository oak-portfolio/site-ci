<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>clean</title>
<link rel="stylesheet" href="base.css">
<style>
.tile { width: 96px; height: 96px; border-radius: 24px; }
.map { position: relative; width: 240px; height: 60px; }
.map svg { position: absolute; inset: 0; }
.lift { box-shadow: var(--shadow-popover); }
</style>
</head>
<body>
<main class="oak-workspace">
  <header data-top-bar class="row">
    <span>Oak</span>
    <button type="button" class="chip" data-nav-search aria-label="Search the site" style="width:44px;height:44px;padding:0;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="#fff" stroke-width="2"/></svg>
    </button>
  </header>
  <section class="oak-openui">
    <p>Two projects, one number and a map.</p>
    <article class="card lift">
      <div data-media><img data-case-image width="120" height="60" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></div>
      <h3>Project title</h3>
      <p>One plain line about the project.</p>
    </article>
    <div class="card" data-picture-ok="the number is the picture">
      <span class="num" data-metric-numeral>42%</span>
      <p>Share of answers with a source.</p>
    </div>
    <div class="row" data-block data-kind="gallery" data-picture-ok="candy tiles are the picture">
      <div class="tile" data-candy-tile style="background:#ff5a5f"></div>
      <div class="tile" data-candy-tile style="background:#3ddc97"></div>
      <div class="tile" data-candy-tile style="background:#4b6fff"></div>
      <div class="tile" data-candy-tile style="background:#ffe066"></div>
    </div>
    <div class="map" data-block data-kind="map">
      <div class="node" data-node="a" style="left:0"></div>
      <div class="node" data-node="b" style="left:160px"></div>
      <svg width="240" height="60" viewBox="0 0 240 60" aria-hidden="true"><path data-edge="line" data-from="a" data-to="b" d="M80 30 L160 30" stroke="#fff" fill="none"/></svg>
    </div>
  </section>
  <div class="row">
    <button type="button" class="chip">First</button>
    <button type="button" class="chip">Second</button>
  </div>
  <div class="row">
    <button type="button" class="chip" aria-expanded="false" aria-controls="more">More</button>
    <div id="more" hidden><a href="#more">Hidden link</a></div>
  </div>
  <div role="dialog" aria-label="Sheet" class="sheet">Sheet text</div>
</main>
</body>
</html>
