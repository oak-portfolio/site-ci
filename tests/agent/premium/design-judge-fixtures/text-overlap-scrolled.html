<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>text-overlap below a scroll fold</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<main class="oak-workspace">
  <div style="height:120px;overflow-y:auto">
    <div style="height:400px"></div>
    <div style="position:relative;height:40px">
      <span style="position:absolute;left:0;top:0">First line of copy</span>
      <span style="position:absolute;left:12px;top:6px">Second line on top</span>
    </div>
  </div>
</main>
</body>
</html>
