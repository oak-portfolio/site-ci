<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>glass-contrast</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<main class="oak-workspace">
  <p style="color:#ffffff;height:200px">Bright copy that scrolls under the floating layer.</p>
</main>
<div role="dialog" aria-label="Glass" style="position:fixed;left:32px;top:32px;width:400px;height:120px;padding:16px;border-radius:24px;background:rgba(255,255,255,0.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#bbbbbb">Light text on a thin glass fill.</div>
</body>
</html>
