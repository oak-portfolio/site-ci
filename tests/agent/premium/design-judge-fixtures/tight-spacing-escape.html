<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tight-spacing-escape</title>
<link rel="stylesheet" href="base.css">
<style>
.stage { position: relative; height: 200px; }
.clip { height: 40px; overflow: hidden; }
.pop { position: absolute; top: 80px; left: 0; display: flex; gap: 4px; }
.chip { width: 100px; }
</style>
</head>
<body>
<main class="oak-workspace">
  <div class="stage">
    <div class="clip">
      <div class="pop">
        <button type="button" class="chip">Escapes</button>
        <button type="button" class="chip">Beside</button>
      </div>
    </div>
  </div>
</main>
</body>
</html>
