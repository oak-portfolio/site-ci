<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stray-blur fixed shell</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<div style="position:fixed;inset:0">
  <main class="oak-workspace" role="dialog" aria-label="Oak AI Agent" style="position:fixed;inset:0;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)">
    <div class="card" style="background:rgba(255,255,255,0.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)">
      <p>A card in the workspace flow that blurs what is behind it.</p>
    </div>
  </main>
</div>
</body>
</html>
