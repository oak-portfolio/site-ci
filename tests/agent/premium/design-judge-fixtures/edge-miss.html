<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>edge-miss</title>
<link rel="stylesheet" href="base.css">
<style>
.map { position: relative; width: 240px; height: 60px; }
.map svg { position: absolute; inset: 0; }
</style>
</head>
<body>
<main class="oak-workspace">
  <div class="map">
    <div class="node" data-node="a" style="left:0"></div>
    <div class="node" data-node="b" style="left:160px"></div>
    <svg width="240" height="60" viewBox="0 0 240 60" aria-hidden="true"><path data-edge="line" data-from="a" data-to="b" d="M80 30 L120 30" stroke="#fff" fill="none"/></svg>
  </div>
</main>
</body>
</html>
