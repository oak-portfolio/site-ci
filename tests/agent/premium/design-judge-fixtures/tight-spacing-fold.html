<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tight-spacing-fold</title>
<link rel="stylesheet" href="base.css">
<style>
.reader { width: 320px; height: 120px; overflow-y: auto; }
.reader .row { gap: 4px; }
.reader .both { margin-top: 14px; }
.reader .end { margin-top: 38px; }
.chip { width: 100px; }
</style>
</head>
<body>
<main class="oak-workspace">
  <div class="reader">
    <div class="row top">
      <button type="button" class="chip">Top one</button>
      <button type="button" class="chip">Top two</button>
    </div>
    <div class="row both">
      <button type="button" class="chip">Middle one</button>
      <button type="button" class="chip">Middle two</button>
    </div>
    <div class="row end">
      <button type="button" class="chip">End one</button>
      <button type="button" class="chip">End two</button>
    </div>
  </div>
</main>
</body>
</html>
